<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RCP Guía · Health Dashboard</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-wrapper">
    <div class="app-container">
      
      <!-- Header con título y tema -->
      <header class="app-header">
        <div class="header-left">
          <div class="logo-icon">
            <i class="fas fa-heartbeat"></i>
          </div>
          <div>
            <h1>RCP <span>Health</span></h1>
            <p class="header-sub">Guía interactiva · Argentina</p>
          </div>
        </div>
        <button id="themeToggle" class="theme-toggle" aria-label="Cambiar tema">
          <i class="fas fa-moon"></i>
        </button>
      </header>

      <!-- Dashboard: resumen de estado -->
      <div class="dashboard-cards">
        <div class="dash-card">
          <span class="dash-label">Estado</span>
          <div class="dash-value" id="statusBadge">
            <span class="badge badge-ready"><i class="fas fa-circle"></i> Listo</span>
          </div>
        </div>
        <div class="dash-card">
          <span class="dash-label">Progreso</span>
          <div class="dash-value" id="progressBadge">0%</div>
        </div>
        <div class="dash-card">
          <span class="dash-label">Tipo</span>
          <div class="dash-value" id="typeBadge">Adulto</div>
        </div>
      </div>

      <!-- Selector de tipo (cards) -->
      <div class="type-selector">
        <button class="type-card active" data-type="adulto">
          <i class="fas fa-user"></i>
          <span>Adulto</span>
        </button>
        <button class="type-card" data-type="nino">
          <i class="fas fa-child"></i>
          <span>Niño</span>
        </button>
        <button class="type-card" data-type="bebe">
          <i class="fas fa-baby"></i>
          <span>Bebé</span>
        </button>
      </div>

      <!-- Progreso circular + paso actual -->
      <div class="progress-dashboard">
        <div class="progress-ring">
          <svg viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="50" fill="none" stroke="var(--border-color)" stroke-width="8" />
            <circle cx="60" cy="60" r="50" fill="none" stroke="var(--primary)" stroke-width="8" 
              stroke-linecap="round" stroke-dasharray="314" stroke-dashoffset="314" id="progressCircle" />
          </svg>
          <div class="ring-label">
            <span id="progressPercent">0%</span>
            <small>completado</small>
          </div>
        </div>
        <div class="step-info">
          <div class="step-number-badge" id="stepNumber">01</div>
          <p class="step-text" id="stepText">Seleccioná un tipo y presioná "Iniciar".</p>
          <div class="step-actions">
            <button id="voiceBtn" class="voice-btn" title="Escuchar paso">
              <i class="fas fa-volume-up"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Controles principales -->
      <div class="controls">
        <button id="startBtn" class="btn btn-primary">
          <i class="fas fa-play"></i> Iniciar Guía
        </button>
        <button id="nextBtn" class="btn btn-outline" disabled>
          <i class="fas fa-arrow-right"></i> Siguiente
        </button>
      </div>

      <!-- Widget: Metrónomo -->
      <div id="metronomeBox" class="widget-metronome" style="display: none;">
        <div class="widget-header">
          <i class="fas fa-drum"></i>
          <span>Metrónomo</span>
          <span class="widget-bpm">100-120/min</span>
        </div>
        <div class="widget-body">
          <div class="metro-visual">
            <div class="pulse-ring" id="pulseRing"></div>
          </div>
          <div class="metro-controls">
            <button id="metroStart" class="metro-btn"><i class="fas fa-play"></i> Iniciar</button>
            <button id="metroStop" class="metro-btn" disabled><i class="fas fa-stop"></i> Parar</button>
          </div>
        </div>
      </div>

      <!-- Botón de emergencia (destacado) -->
      <a href="tel:107" class="btn btn-emergency">
        <i class="fas fa-phone-alt"></i> Llamar al 107 (Emergencia)
      </a>

      <!-- Toast para notificaciones -->
      <div id="toast" class="toast" style="display: none;"></div>

      <p class="disclaimer">
        <i class="fas fa-exclamation-triangle"></i> 
        Guía de auxilio. No reemplaza la formación profesional. 
        Ante una emergencia real, llamá al <strong>107</strong> o <strong>911</strong>.
      </p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
